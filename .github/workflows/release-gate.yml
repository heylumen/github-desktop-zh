name: release-gate

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            gui/requirements-build.txt
            gui/constraints-build.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r gui/requirements-build.txt -c gui/constraints-build.txt
          python -m pip check
          npm install --prefix .work/js-parser --no-save acorn@8.15.0

      - name: Gates
        run: |
          python scripts/build_dictionary_manifest.py --check
          python scripts/check_dictionaries.py
          python scripts/check_privacy.py
          python scripts/check_self_methods.py
          python scripts/check_consistency.py
          python scripts/check_contrast.py
          python -m pyright
          python -m ruff check .

      - name: Tests and P1 gates
        env:
          GDF_REQUIRE_NODE: "1"
        run: |
          python -m coverage run --source=gui -m unittest discover -s tests -v
          python -m coverage report --fail-under=68
          python scripts/check_visual.py

      - name: Build
        run: |
          python -m PyInstaller --clean --noconfirm --distpath gui/dist --workpath gui/build github-desktop-zh-1.0.3.spec

      - name: Verify and release gate
        run: |
          python scripts/verify_archive.py gui/dist/github-desktop-zh-1.0.3.exe --version 1.0.3
          python scripts/smoke_exe.py gui/dist/github-desktop-zh-1.0.3.exe
          python scripts/build_release.py --exe gui/dist/github-desktop-zh-1.0.3.exe
          python scripts/check_consistency.py
          python scripts/check_release.py --require-tag --exe gui/dist/github-desktop-zh-1.0.3.exe

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: |
            gui/dist/github-desktop-zh-1.0.3.exe
            gui/dist/SHA256SUMS.txt
            gui/dist/build-info.json
            gui/dist/licenses/**
          if-no-files-found: error
