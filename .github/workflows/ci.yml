name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            gui/requirements-build.txt
            gui/constraints-build.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install build/test dependencies (pinned)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r gui/requirements-build.txt -c gui/constraints-build.txt
          python -m pip check

      - name: Install Acorn 8.15.0 for AST verifier tests
        run: npm install --prefix .work/js-parser --no-save acorn@8.15.0

      - name: Check dictionary manifest and JavaScript syntax
        run: |
          python scripts/build_dictionary_manifest.py --check
          python scripts/check_dictionaries.py

      - name: Static, consistency and accessibility gates
        run: |
          python scripts/check_privacy.py
          python scripts/check_self_methods.py
          python scripts/check_consistency.py
          python scripts/check_contrast.py
          python -m pyright
          python -m ruff check .

      - name: Run test suite with coverage (Node tests must not be skipped)
        env:
          GDF_REQUIRE_NODE: "1"
        run: |
          python -m coverage run --source=gui -m unittest discover -s tests -v
          python -m coverage report --fail-under=68

      - name: Screenshot regression
        run: python scripts/check_visual.py

      - name: Build single-file EXE
        run: |
          python -m PyInstaller --clean --noconfirm --distpath gui/dist --workpath gui/build github-desktop-zh-1.0.3.spec

      - name: Verify archive and produce release hashes
        run: |
          python scripts/verify_archive.py gui/dist/github-desktop-zh-1.0.3.exe --version 1.0.3
          python scripts/smoke_exe.py gui/dist/github-desktop-zh-1.0.3.exe
          python scripts/build_release.py --exe gui/dist/github-desktop-zh-1.0.3.exe
          python scripts/check_consistency.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: github-desktop-zh-1.0.3
          path: |
            gui/dist/github-desktop-zh-1.0.3.exe
            gui/dist/SHA256SUMS.txt
            gui/dist/build-info.json
            gui/dist/licenses/**
          if-no-files-found: error
